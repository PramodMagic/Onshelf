<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onshelf Bin Tool</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#1d6fe8;--acx:#fff;--ok:#14803c;--err:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#9aa3af;--bd:#2f343b;--ac:#5b9bff;--acx:#0b1220;--ok:#4ade80;--err:#ff7b7b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px}
input,select{flex:1;min-width:0;padding:13px;font-size:17px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.binb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.binb b{font-size:24px}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item .s{flex:1;word-break:break-all;font-weight:600}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px}
.q span{min-width:30px;text-align:center;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.msg{min-height:22px;font-size:14px;margin-top:6px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.stats div{font-size:14px;color:var(--mut)}.stats b{display:block;font-size:22px;color:var(--tx)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}
.ban{background:var(--card);border:1px solid var(--err);color:var(--err);padding:10px;border-radius:10px;margin-bottom:12px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;flex-direction:column;justify-content:center;padding:16px}
.ov.on{display:flex}
#reader{width:100%;max-width:480px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
.ov .btn{max-width:480px;width:100%;margin:12px auto 0}
#ovm{color:#fff;text-align:center;margin-top:10px;font-size:14px}
.pinbox{max-width:360px;width:100%;margin:0 auto;background:var(--card);border-radius:14px;padding:18px}
.pinbox .btn{width:auto;max-width:none;margin:0;flex:0 0 auto}
.pinbox input{flex:1 1 auto;width:100%}
.item .s{cursor:pointer}
.q .ed{font-size:15px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#sheet.on{display:block}
#sheet .in{max-width:480px;margin:0 auto;background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#sheet h3{margin:0 0 10px;font-size:16px}
#cfW{min-height:20px;color:var(--err);font-size:14px;margin:6px 0 10px;font-weight:600}
#sheet .btns{display:flex;gap:10px}
#sheet .btns .btn{flex:1;padding:15px;font-size:18px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.lang button{padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px;font-weight:600}
.lang button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.hide{display:none}
.ubar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ubar b{font-size:17px}
.sbar{border:2px solid var(--ok)}
.sbar .t{font-weight:700;margin-bottom:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--bd)}
.pill.open{color:#b45309;border-color:#b45309}.pill.done{color:var(--ok);border-color:var(--ok)}
.sess{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.sess:first-child{border-top:0}
.sess .i{flex:1;min-width:0}.sess .i b{font-size:16px}
.sess .btn{padding:9px 12px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang"><button id="lEn">English</button><button id="lHi">हिन्दी</button></div>
  <div class="tabs">
    <button class="tab on" id="t1" data-i="tab_scan"></button>
    <button class="tab" id="t2" data-i="tab_data"></button>
  </div>
  <div id="ban" class="ban hide"></div>

  <div id="v1">
    <div class="msg" id="msgTop"></div>
    <div class="card hide" id="nameCard">
      <h2 data-i="name_h"></h2>
      <div class="row">
        <input id="nameIn" name="o_user_nm" data-ph="ph_name" autocomplete="off">
        <button class="btn p" id="nameOk" data-i="ok"></button>
      </div>
      <div class="mut" style="margin-top:8px" data-i="name_note"></div>
    </div>
    <div class="ubar hide" id="uBar">
      <div>👤 <b id="uName"></b></div>
      <button class="btn" id="uChg" data-i="chg_name"></button>
    </div>
    <div class="card sbar hide" id="sessBar">
      <div class="t" data-i="sess_on"></div>
      <div class="mut" id="sessInfo"></div>
      <button class="btn g" id="complete" style="width:100%;margin-top:10px;padding:14px;font-size:17px" data-i="complete"></button>
    </div>
    <div class="card hide" id="binCard">
      <h2 data-i="step1"></h2>
      <div class="row">
        <input id="binIn" name="o_bin_no" value="" data-ph="ph_bin" autocomplete="off" autocapitalize="characters">
        <button class="btn p" id="binOk" data-i="ok"></button>
      </div>
      <div class="row" style="margin-top:8px"><button class="btn" id="binCam" style="width:100%" data-i="cam_bin"></button></div>
    </div>

    <div id="work" class="hide">
      <div class="card binb">
        <div><div class="mut" data-i="cur_bin"></div><b id="binName"></b></div>
        <button class="btn" id="binChg" data-i="chg_bin"></button>
      </div>
      <div class="card">
        <h2 data-i="step2"></h2>
        <div class="row">
          <input id="skuIn" data-ph="ph_sku" autocomplete="off" autocapitalize="characters">
          <button class="btn p" id="skuOk" data-i="add"></button>
        </div>
        <div class="row" style="margin-top:8px"><button class="btn" id="skuCam" style="width:100%" data-i="cam_sku"></button></div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card">
        <h2><span data-i="scanned"></span> · <span id="cnt">0</span> SKU · <span id="tq">0</span> qty</h2>
        <div id="list"></div>
      </div>
      <button class="btn g" id="save" style="width:100%;padding:16px;font-size:18px" disabled data-i="save"></button>
    </div>
  </div>

  <div id="v2" class="hide">
    <div class="card">
      <div class="stats">
        <div><b id="sB">0</b><span data-i="st_bins"></span></div>
        <div><b id="sR">0</b><span data-i="st_rows"></span></div>
        <div><b id="sQ">0</b><span data-i="st_qty"></span></div>
      </div>
      <div class="row" style="margin-bottom:8px"><select id="dsel"></select><button class="btn" id="rf" title="Refresh">🔄</button></div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn p" id="dl" style="flex:1" data-i="dl_all"></button>
        <button class="btn" id="clr" data-i="clr"></button>
      </div>
      <div class="mut" style="margin-top:8px" data-i="note"></div>
      <div class="msg" id="msg2"></div>
    </div>
    <div class="card" id="sessCard">
      <h2 data-i="sess_h"></h2>
      <div id="sessList"></div>
    </div>
    <div class="card tw">
      <table><thead><tr><th>S.No</th><th>SKU</th><th>QTY</th><th>BIN</th><th data-i="th_user"></th><th data-i="th_onshelf"></th></tr></thead><tbody id="tb"></tbody></table>
      <div id="empty" class="mut" style="padding:10px 0" data-i="no_data"></div>
    </div>
  </div>
</div>

<div id="ov" class="ov">
  <div id="reader"></div>
  <div id="ovm" data-i="cam_hint"></div>
  <button class="btn" id="ovx" data-i="close"></button>
</div>

<div id="sheet">
  <div class="in">
    <h3 id="cfT"></h3>
    <input id="cfIn" autocomplete="off" autocapitalize="characters" style="width:100%">
    <div id="cfW"></div>
    <div class="btns">
      <button class="btn" id="cfNo" data-i="cancel"></button>
      <button class="btn g" id="cfOk" data-i="ok2"></button>
    </div>
  </div>
</div>

<div id="pinov" class="ov">
  <div class="pinbox">
    <h2 data-i="pin_title"></h2>
    <div class="row"><input id="pinIn" type="password" inputmode="numeric" data-ph="ph_pin" autocomplete="off"><button class="btn p" id="pinOk" data-i="open"></button></div>
    <div class="msg err" id="pinMsg"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

// ---- API ----
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json','x-pin':pin},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){showPin(t('pin_wrong'));throw new Error('BADPIN');}
  if(!r.ok)throw new Error(errText(j.error)||('HTTP '+r.status));
  return j;
}

// ---- UI helpers ----
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'');}
function tab(n){$('v1').classList.toggle('hide',n!==1);$('v2').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);}

function render(){
  const has=!!bin;
  $('nameCard').classList.toggle('hide',!!uname);
  $('uBar').classList.toggle('hide',!uname);$('uName').textContent=uname;
  $('binCard').classList.toggle('hide',has||!uname);

  const L=$('list');L.innerHTML='';

  items.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='item';
    const s=document.createElement('div');s.className='s';s.textContent=it.sku;
    const q=document.createElement('div');q.className='q';
    const m=document.createElement('button');m.textContent='−';
    const n=document.createElement('span');n.textContent=it.qty;
    const p=document.createElement('button');p.textContent='+';
    const ed=document.createElement('button');ed.textContent='✏';ed.className='ed';ed.title=t('t_edit');ed.onclick=()=>openConfirm(it.sku,'edit');
    s.onclick=()=>openConfirm(it.sku,'edit');

    p.onclick=()=>{it.qty++;saveDraft();render()};
    x.onclick=()=>{items=items.filter(i=>i!==it);saveDraft();render()};

  });
}

function addSku(v){

}

// ---- beep + confirm (har scan par OK) ----
let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
document.addEventListener('pointerdown',unlockAudio);
function beep(){
  try{unlockAudio();if(actx){const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=1000;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.18);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
}
let cf=null;
function openConfirm(code,mode,done){
  cf={mode,orig:norm(code),done};
  if(mode==='add')beep();
  $('cfT').textContent=t(mode==='edit'?'cf_edit':'cf_add');
  $('cfIn').value=norm(code);
  cfWarn();
  $('sheet').classList.add('on');
  setTimeout(()=>$('cfOk').focus(),30);
}
function cfWarn(){
  if(!cf)return;
  const v=norm($('cfIn').value);
  const f=items.find(i=>i.sku===v&&!(cf.mode==='edit'&&v===cf.orig));
  $('cfW').textContent=f?t(cf.mode==='edit'?'dup_edit':'dup_add',{q:f.qty}):'';
}
function renameSku(old,nw){
  const it=items.find(i=>i.sku===old);if(!it||old===nw)return;
  const other=items.find(i=>i.sku===nw);
  if(other){other.qty+=it.qty;items=items.filter(i=>i!==it);}else it.sku=nw;
  saveDraft();render();say(t('renamed',{v:nw}),'ok');
}
function cfClose(ok){
  if(!cf)return;
  const c=cf;cf=null;$('sheet').classList.remove('on');
  if(ok){const v=norm($('cfIn').value);if(v){if(c.mode==='add')addSku(v);else renameSku(c.orig,v);}}
  if(c.done)c.done(ok);
}
$('cfOk').onclick=()=>cfClose(true);
$('cfNo').onclick=()=>cfClose(false);
$('cfIn').oninput=cfWarn;
$('cfIn').onkeydown=e=>{if(e.key==='Enter')cfClose(true);if(e.key==='Escape')cfClose(false);};

let camBusy=false,blockCode='',miss=0;
async function openCam(mode){
  unlockAudio();qrMode=mode;camBusy=false;blockCode='';miss=0;$('ov').classList.add('on');$('ovm').textContent=t('cam_hint');

  qr=null;camBusy=false;blockCode='';miss=0;

function onMiss(){if(blockCode&&++miss>6){blockCode='';miss=0;}}
function onCode(txt){
  if(camBusy)return;
  if(txt===blockCode){miss=0;return;}
  camBusy=true;
  if(qrMode==='bin'){beep();setBin(txt);closeCam();return;}
  try{qr.pause(true)}catch(e){}
  $('ovm').textContent=t('code_found');
  openConfirm(txt,'add',()=>{
    blockCode=txt;miss=0;camBusy=false;
    $('ovm').textContent=t('next_prod');
    try{if(qr)qr.resume()}catch(e){}
  });
}

// ---- data (date-wise -> user-wise onshelf sessions) ----
let selDate='';
const pad=n=>String(n).padStart(2,'0');
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=d=>d.split('-').reverse().join('-');
const safe=x=>String(x||'').replace(/[^A-Za-z0-9\u0900-\u097F]+/g,'_').replace(/^_+|_+$/g,'')||'user';

// saves + server sessions -> har onshelf session ek object
function buildSessions(){
  const m=new Map();
  srv.forEach(x=>m.set(x.id,{...x,saves:[]}));
  saves.forEach(sv=>{
    const id=sv.sid||('legacy-'+dkey(sv.ts));
    if(!m.has(id))m.set(id,{id,user:sv.user||'',uk:'legacy',ts:sv.ts,end:null,status:'closed',legacy:true,saves:[]});
    m.get(id).saves.push(sv);
  });
  const list=[...m.values()].filter(x=>x.saves.length);
  list.forEach(x=>{
    if(x.legacy)x.ts=Math.min(...x.saves.map(v=>v.ts));
    x.date=dkey(x.ts);
    const mm=new Map();
    x.saves.slice().sort((a,b)=>a.ts-b.ts).forEach(sv=>(sv.items||[]).forEach(i=>{
      const k=sv.bin+'\u0001'+i.sku;
      if(mm.has(k))mm.get(k).qty+=i.qty;else mm.set(k,{sku:i.sku,qty:i.qty,bin:sv.bin});
    }));
    x.rows=[...mm.values()];
    x.bins=new Set(x.saves.map(v=>v.bin)).size;
    x.qty=x.rows.reduce((a,b)=>a+b.qty,0);
  });
  // same user + same date ke sessions ko 1,2,3 number do
  const cnt={};
  list.sort((a,b)=>a.ts-b.ts).forEach(x=>{const k=x.date+'|'+x.uk;cnt[k]=(cnt[k]||0)+1;x.n=cnt[k];});
  return list;
}
const dates=()=>[...new Set(buildSessions().map(s=>s.date))].sort().reverse();
const sessOf=date=>buildSessions().filter(s=>date==='ALL'||s.date===date).sort((a,b)=>a.date===b.date?(a.uk===b.uk?a.ts-b.ts:a.user.localeCompare(b.user)):(a.date<b.date?1:-1));
const label=s=>s.legacy?t('old_data'):s.user+' · Onshelf '+s.n;

function renderData(){
  const ds=dates();
  if(selDate!=='ALL'&&!ds.includes(selDate))selDate=ds[0]||'ALL';
  const sel=$('dsel');sel.innerHTML='';
  ds.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=fd(d);sel.append(o)});
  if(ds.length){const o=document.createElement('option');o.value='ALL';o.textContent=t('all_dates');sel.append(o)}
  sel.value=selDate;
  const ss=sessOf(selDate);
  const SL=$('sessList');SL.innerHTML='';
  ss.forEach(s=>{
    const d=document.createElement('div');d.className='sess';
    const i=document.createElement('div');i.className='i';
    const ttl=document.createElement('b');ttl.textContent=(selDate==='ALL'?fd(s.date)+' · ':'')+label(s);
    const pl=document.createElement('span');pl.className='pill '+(s.status==='open'?'open':'done');pl.style.marginLeft='8px';pl.textContent=s.status==='open'?t('s_open'):t('s_done');
    const sub=document.createElement('div');sub.className='mut';
    sub.textContent=t('sess_sub',{b:s.bins,r:s.rows.length,q:s.qty,t:hm(s.ts)+(s.end?' – '+hm(s.end):'')});
    i.append(ttl,pl,sub);
    const bt=document.createElement('button');bt.className='btn p';bt.textContent='⬇ Excel';bt.onclick=()=>downloadSession(s);
    d.append(i,bt);SL.append(d);
  });
  if(!ss.length){SL.innerHTML='<div class="mut"></div>';SL.firstChild.textContent=t('no_sess');}
  const list=ss.flatMap(s=>s.rows.map(r=>({...r,s})));
  const tb=$('tb');tb.innerHTML='';
  list.forEach((x,i)=>{const tr=document.createElement('tr');
    [i+1,x.sku,x.qty,x.bin,x.s.legacy?'—':x.s.user,x.s.legacy?t('old_short'):(selDate==='ALL'?x.s.date.slice(5)+' #':'#')+x.s.n].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tb.append(tr)});
  $('empty').classList.toggle('hide',list.length>0);
  $('sB').textContent=ss.reduce((a,s)=>a+s.bins,0);
  $('sR').textContent=list.length;
  $('sQ').textContent=list.reduce((a,b)=>a+b.qty,0);
}
$('rf').onclick=()=>refresh();
$('dsel').onchange=e=>{selDate=e.target.value;renderData();};

// Excel files hamesha English format mein (S.No, SKU, QTY, BIN)
function sheet(r){
  const ws=XLSX.utils.aoa_to_sheet([['S.No','SKU','QTY','BIN'],...r.map((x,i)=>[i+1,x.sku,x.qty,x.bin])]);
  ws['!cols']=[{wch:6},{wch:24},{wch:8},{wch:14}];return ws;
}
function infoSheet(s){
  const ws=XLSX.utils.aoa_to_sheet([
    ['User',s.legacy?'—':s.user],['Date',s.date],['Onshelf no. (that day)',s.legacy?'—':s.n],
    ['Start',hm(s.ts)],['End',s.end?hm(s.end):'(running)'],['Status',s.status==='open'?'Running':'Completed'],
    ['Total BIN',s.bins],['Total rows',s.rows.length],['Total QTY',s.qty]]);
  ws['!cols']=[{wch:22},{wch:20}];return ws;
}
function sheetName(wb,n0){
  let n=n0.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31).trim()||'Sheet',k=2,base=n;
  while(wb.SheetNames.includes(n)){const x='_'+k++;n=base.slice(0,31-x.length)+x;}
  return n;
}
function saveBlob(blob,fn){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function writeWb(wb,fn){
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fn);
}
// ek onshelf = ek Excel
function downloadSession(s){
  if(typeof XLSX==='undefined'){$('msg2').textContent=t('no_lib');return;}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheet(s.rows),'Onshelf');
  XLSX.utils.book_append_sheet(wb,infoSheet(s),'Info');
  const fn='Onshelf_'+s.date+'_'+(s.legacy?'Old':safe(s.user)+'_'+s.n)+'.xlsx';
  writeWb(wb,fn);
  $('msg2').textContent=t('dl_start',{f:fn});
}
// sab sessions ek file mein, har session ki alag sheet
$('dl').onclick=()=>{
  if(typeof XLSX==='undefined'){$('msg2').textContent=t('no_lib');return;}
  const ss=sessOf(selDate);if(!ss.length){$('msg2').textContent=t('no_dl');return;}
  const wb=XLSX.utils.book_new();
  ss.forEach(s=>XLSX.utils.book_append_sheet(wb,sheet(s.rows),sheetName(wb,(selDate==='ALL'?s.date.slice(5)+' ':'')+(s.legacy?'Old':s.user+' '+s.n))));
  const fn=selDate==='ALL'?'Onshelf_All_Dates.xlsx':'Onshelf_'+selDate+'_AllUsers.xlsx';
  writeWb(wb,fn);$('msg2').textContent=t('dl_start',{f:fn});
};
$('clr').onclick=async()=>{
  const ss=sessOf(selDate);
  if(!online||!ss.length)return;
  const open=ss.filter(s=>s.status==='open').length;
  if(!confirm(t('c_clear',{d:selDate==='ALL'?t('all_dates'):fd(selDate),o:open?t('c_open',{n:open}):''})))return;
  try{
    await api('DELETE','/api/saves',{ids:ss.flatMap(s=>s.saves.map(v=>v.id)),sids:ss.filter(s=>!s.legacy).map(s=>s.id)});
    $('msg2').textContent=t('cleared');refresh();}
  catch(e){$('msg2').textContent=t('clear_fail',{e:e.message});}
};

// ---- boot ----
async function start(){
  online=true;renderData();render();
  if(!bin&&!items.length){
    try{const d=await api('GET','/api/draft?dev='+encodeURIComponent(dev));
      if(d&&d.bin&&d.items&&d.items.length){bin=d.bin;items=(d.items||[]).map(i=>({sku:i.sku,qty:i.qty}));ls.set('onshelf-draft',JSON.stringify({bin,items}));render();}}catch(e){}
  }
  startPolling();
}
loadDraft();applyLang();
if(!pin)showPin('');
else api('GET','/api/saves').then(r=>{saves=r.saves||[];srv=r.sessions||[];start();}).catch(e=>{if(e.message!=='BADPIN')banner(t('conn_fail',{e:e.message}));});
</script>
</body>
